[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-ruleforge"
version = "0.1.1"
description = "Offline Sigma validation, Splunk conversion and synthetic event testing"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3"]
license = "MIT"

[project.scripts]
ruleforge = "ruleforge.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]
audit = ["pip-audit>=2.9,<3"]
build = ["setuptools==84.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
