name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked ruff check src tests scripts/publish_release.py scripts/package_smoke.py
      - run: uv run --locked ruff format --check src tests scripts/publish_release.py scripts/package_smoke.py
      - run: uv run --locked pytest -q
      - run: uv run --locked ruleforge test --manifest examples/manifest.json
      - run: python scripts/smoke.py
      - run: uv build
      - run: python scripts/package_smoke.py
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv export --locked --all-groups --no-hashes --no-emit-project --format requirements-txt -o audit-requirements.txt
      - run: uv run --locked --group audit pip-audit --no-deps --disable-pip -r audit-requirements.txt --format json
  release:
    needs: [verify, audit]
    if: github.repository == 'mejustbox-byte/sigma-ruleforge' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: ruleforge-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv build
      - run: python scripts/publish_release.py
        env:
          GH_TOKEN: ${{ github.token }}
